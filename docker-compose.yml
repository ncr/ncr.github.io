services:
  blog:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
        PUBLIC_OWNER_PUBKEY: ${OWNER_PUBKEY:-}
        PUBLIC_POW_BITS: ${POW_BITS:-18}
        PUBLIC_ROOM_NS: ${ROOM_NS:-ncr-blog}
        PUBLIC_SIGNALS: ${SIGNALS:-}
    environment:
      SIGNALS: ws://localhost:8080/signal
    ports:
      - "8080:8080"
    volumes:
      - blog-data:/data
    restart: unless-stopped
volumes:
  blog-data:
