# Statyczna strona na GitHub Pages (ncr.github.io). Komentarze i statystyki są P2P (WebRTC);
# jedyna potrzebna infrastruktura to signaling – adresy wss:// podaje zmienna repozytorium
# SIGNALS (CSV). Bez niej peery nie mają się jak znaleźć i strona pokazuje tylko lokalny cache.
# OWNER_PUBKEY (zmienna repo) i POW_BITS wchodzą do builda i muszą być zgodne u wszystkich kopii.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: site
        env:
          SITE_URL: https://ncr.github.io
          PUBLIC_OWNER_PUBKEY: ${{ vars.OWNER_PUBKEY }}
          PUBLIC_SIGNALS: ${{ vars.SIGNALS }}
          PUBLIC_POW_BITS: '18'
          PUBLIC_ROOM_NS: ncr-blog
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
