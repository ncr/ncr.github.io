# Statyczna strona na GitHub Pages (ncr.github.io). Peer (komentarze, statystyki) musi stać osobno
# pod HTTPS – jego adres podaje zmienna repozytorium PEER_URL (Settings → Variables), np.
# https://blog-peer.example.com. Bez niej strona działa, a komentarze pokazują „peer niedostępny".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: site
        env:
          SITE_URL: https://ncr.github.io
          PUBLIC_PEER_URL: ${{ vars.PEER_URL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
